version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      PYTHONPATH: /app
      PGHOST: db
      REDIS_HOST: redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      redis:
        condition: service_started
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_HOST: redis
    command: ["celery", "-A", "api.celery_app", "worker", "--loglevel=info"]
    deploy:
      replicas: 0

volumes:
  postgres_data:
